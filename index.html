<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NES World 8 - Play Classic Games</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#0f0f0f; color:#fff; text-align:center; padding:20px; }
    h1 { color:#ff4500; }
    .game-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:15px; margin-top:20px; }
    .game { background:#1e1e1e; padding:15px; border-radius:10px; }
    a { color:#00ff88; text-decoration:none; }
  </style>
</head>
<body>
  <h1>🎮 NES World 8</h1>
  <p>Play Classic Retro Games</p>
  <div class="game-list" id="games">Loading games...</div>

  <script>
    // Netlify Identity - Recovery & Login handle
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
    // Simple games loader
    document.getElementById('games').innerHTML = '<p>Welcome! <a href="/admin/">Go to Admin</a> to add games.</p>';
  </script>
</body>
</html>
